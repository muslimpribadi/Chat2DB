name: Build and Push GHCR Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. 5.3.0 or v5.3.0)'
        required: false
        default: 'latest'
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: chat2db-community-client/yarn.lock

      - name: Build frontend
        working-directory: chat2db-community-client
        run: |
          yarn install --frozen-lockfile
          UMI_PublicPath=/static/front/ yarn run build:web:community

      - name: Stage frontend for Spring Boot
        shell: bash
        run: |
          set -euo pipefail
          resources=chat2db-community-server/chat2db-community-start/src/main/resources
          rm -rf "${resources}/static/front"
          mkdir -p "${resources}/static/front" "${resources}/thymeleaf"
          cp -R chat2db-community-client/dist/. "${resources}/static/front/"
          cp chat2db-community-client/dist/index.html "${resources}/thymeleaf/index.html"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package backend
        shell: bash
        run: |
          set -euo pipefail
          mvn -B clean package \
            -Dmaven.test.skip=true \
            -Dchat2db.finalName=chat2db-community \
            -f chat2db-community-server/pom.xml \
            -pl chat2db-community-start \
            -am
          test -f chat2db-community-server/chat2db-community-start/target/chat2db-community.jar
          test -d chat2db-community-server/chat2db-community-start/target/lib

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || inputs.version == 'latest' }}
            type=ref,event=tag
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' && inputs.version != 'latest' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: chat2db-community-server/chat2db-community-start/target
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
